[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostvalue"
version = "0.4.0"
description = "Windows single-player trainer for a locally installed Kingdom Rush Genesis"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "GhostValue contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.gui-scripts]
ghostvalue = "ghostvalue.launcher:main"

[tool.setuptools.packages.find]
include = ["ghostvalue", "ghostvalue.*"]
exclude = ["tests*", "tools*"]
